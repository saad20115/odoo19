# SJC Leaves PWA (Beta) — HTTPS front
# https://aboghaliaoffice.com:8443/  →  leave-pwa proxy :8095 → Odoo beta :8070
#
# Install:
#   cp deploy/nginx-leave-pwa-beta.conf /etc/nginx/sites-available/leave-pwa-beta.conf
#   ln -sfn /etc/nginx/sites-available/leave-pwa-beta.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream leave_pwa_beta {
    server 127.0.0.1:8095;
    keepalive 8;
}

server {
    listen 8443 ssl http2;
    server_name aboghaliaoffice.com www.aboghaliaoffice.com;

    ssl_certificate     /etc/letsencrypt/live/aboghaliaoffice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aboghaliaoffice.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 25M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://leave_pwa_beta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header access-token $http_access_token;
        proxy_set_header x-company-id $http_x_company_id;
        proxy_set_header x-company-ids $http_x_company_ids;
        proxy_set_header Connection "";
        # Keep PWA login independent from Odoo web session cookies
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
